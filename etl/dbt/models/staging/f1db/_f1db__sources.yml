version: 2

sources:
  - name: f1db
    schema: f1db
    description: Source tables and views restored from the F1DB PostgreSQL dump.
    tables:
      - name: country
      - name: driver
      - name: constructor
      - name: constructor_chronology
      - name: engine_manufacturer
      - name: circuit
      - name: circuit_layout
      - name: grand_prix
      - name: season
      - name: season_driver_standing
      - name: season_constructor_standing
      - name: race
      - name: race_driver_standing
      - name: race_constructor_standing
      - name: qualifying_result
      - name: sprint_race_result
      - name: race_result
      - name: fastest_lap
      - name: pit_stop
