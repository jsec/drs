version: 2

models:
  - name: int_jolpica__race_laps
    columns:
      - name: external_race_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_jolpica__race_identities')
                field: external_race_id
      - name: external_driver_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_jolpica__driver_identities')
                field: external_driver_id
  - name: int_jolpica__race_identities
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "abs(external_race_date - race_date) <= 1"
          config:
            severity: warn
    columns:
      - name: external_race_id
        tests:
          - not_null
          - unique
      - name: race_id
        tests:
          - not_null
          - unique
  - name: int_jolpica__driver_identities
    columns:
      - name: external_driver_id
        tests:
          - not_null
          - unique
      - name: driver_id
        tests:
          - not_null
