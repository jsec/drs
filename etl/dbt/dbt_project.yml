name: drs
version: "1.0.0"
config-version: 2

profile: drs

model-paths:
  - models
test-paths:
  - tests
seed-paths:
  - seeds
macro-paths:
  - macros

clean-targets:
  - target
  - dbt_packages

models:
  drs:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: ephemeral
    marts:
      effone:
        +materialized: table
        +schema: effone
        races:
          +indexes:
            - columns: [season, race_round]
            - columns: [circuit_id]
        race_results:
          +indexes:
            - columns: [season, driver_id]
        sprint_results:
          +indexes:
            - columns: [season, driver_id]
        driver_standings_snapshots:
          +indexes:
            - columns: [season, driver_id]
        constructor_standings_snapshots:
          +indexes:
            - columns: [season, constructor_id]
        driver_season_constructor_summaries:
          +indexes:
            - columns: [driver_id, season]
