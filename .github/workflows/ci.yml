name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.go }}
      web: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.web }}
      etl: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.etl }}
    steps:
      - uses: actions/checkout@v4

      - id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            go:
              - 'cmd/**'
              - 'internal/**'
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
              - '.github/**'
              - 'Taskfile.yml'
              - 'mise.toml'
              - 'lefthook.yml'
              - 'renovate.json'
            web:
              - 'web/**'
              - '.github/**'
              - 'Taskfile.yml'
              - 'mise.toml'
              - 'lefthook.yml'
              - 'renovate.json'
            etl:
              - 'etl/**'
              - '.github/**'
              - 'Taskfile.yml'
              - 'mise.toml'
              - 'lefthook.yml'
              - 'renovate.json'

  go:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && needs.changes.outputs.go == 'true') ||
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/') && needs.changes.outputs.go == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: true

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2
        with:
          version: 3.x

      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Test
        run: task test

      - name: Lint
        run: task lint

      - name: Build
        run: task build

  web:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && needs.changes.outputs.web == 'true') ||
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/') && needs.changes.outputs.web == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '26.8.1'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Lint
        run: pnpm --dir web lint

      - name: Test
        run: pnpm --dir web test

      - name: Build
        run: pnpm --dir web build

  etl:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && needs.changes.outputs.etl == 'true') ||
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/') && needs.changes.outputs.etl == 'true')
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: etl/uv.lock

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2
        with:
          version: 3.x

      - name: Install dependencies
        working-directory: etl
        run: uv sync --locked

      - name: Check SQL formatting
        run: task etl:format-check

      - name: Install dbt packages
        run: task etl:dbt-deps

      - name: Parse dbt project
        run: task etl:dbt-parse
